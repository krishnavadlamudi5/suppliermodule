<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier ESG Assessment — Client portal (redesign prototype)</title>
<style>
:root{
  --page:#f6f6f4; --surface:#ffffff; --chart:#fcfcfb; --ink:#141413; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --line:rgba(11,11,11,.10); --line2:rgba(11,11,11,.18);
  --brand:#b3261e; --brand-ink:#8f1d17; --brand-soft:#fbecea;
  --accent:#2a78d6; --accent-soft:#e8f1fc; --s2:#eb6834; --grey:#a9a8a2;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --r:10px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-size:14px;line-height:1.45}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:14px 12px 12px;overflow:auto}
.org{display:flex;gap:10px;align-items:center;padding:4px 8px 10px}
.org .av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.org b{display:block;font-size:14px}.org small{color:var(--ink2);font-size:12px}
.grp{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:500;margin-bottom:1px}
.nav a:hover{background:#f1f1ee;color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-left:auto;background:var(--brand);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:600}
.nav .new{margin-left:auto;font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px}
.side .foot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* Top bar */
.main{min-width:0}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;width:340px;background:#fff}
.search input{border:0;outline:0;width:100%;background:transparent}
.search svg,.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.sample{font-size:11px;font-weight:600;color:#7a5a00;background:#fff3d1;border:1px solid #f3d27a;border-radius:6px;padding:2px 8px}
.top .sp{flex:1}
.iconbtn{position:relative;width:36px;height:36px;border-radius:8px;border:1px solid var(--line2);background:#fff;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;color:var(--ink2)}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;background:var(--brand);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:20px;padding:3px 10px 3px 3px;background:#fff;position:relative}
.me .av{width:28px;height:28px;border-radius:50%;background:#e3efe0;color:#2f6b25;display:grid;place-items:center;font-size:12px;font-weight:700}
.me b{font-size:13px;display:block;line-height:1.1}.me small{font-size:11px;color:var(--ink2)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);min-width:200px;padding:6px;z-index:40;display:none}
.menu.open{display:block}
.menu a,.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.menu a:hover,.menu button:hover{background:#f3f3f0}

/* Page */
.page{padding:24px 28px 60px;max-width:1320px}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--ink2)}
.ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center;position:relative}
.crumb{font-size:12px;color:var(--ink2);margin-bottom:6px}
.crumb a{color:var(--accent)}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f6f6f3}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ok{border-color:#9bd49b;color:var(--good-ink);background:#eef8ee}
.btn.bad{border-color:#f0b2b2;color:#a52222;background:#fdf0f0}
.link{color:var(--accent);font-weight:500}
.link:hover{text-decoration:underline}

.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;color:var(--ink2);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
select.inp,input.inp,textarea.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 10px;background:#fff;width:100%}
select.inp{width:auto}
.inp:focus{outline:2px solid #b7d3f6;border-color:var(--accent)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 4px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{margin-bottom:14px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs a{padding:9px 14px;color:var(--ink2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-color:var(--brand);font-weight:600}
.tabs a .n{font-size:11px;background:#eeeeea;border-radius:9px;padding:1px 7px;margin-left:6px;color:var(--ink2)}
.tabs a.on .n{background:var(--brand-soft);color:var(--brand-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h3{font-size:15px;font-weight:650}
.card .q{color:var(--ink2);font-size:13px;margin:3px 0 12px}
.card .cf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.span2{grid-column:span 2}
.stack>*+*{margin-top:16px}

/* Needs you */
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.need{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.need:hover{border-color:var(--line2);border-left-color:var(--brand);background:#fffdfc}
.need .num{font-size:26px;font-weight:650;min-width:30px}
.need b{display:block;font-size:13.5px}.need small{color:var(--ink2);font-size:12px}
.need.zero{border-left-color:var(--grid)}
.need.zero .num{color:var(--muted)}

/* Tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink2);letter-spacing:.02em;background:#fafaf8;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#fbfbf9}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td small{display:block;color:var(--muted);font-size:12px}
.tbl a.nm{font-weight:600}
.tbl a.nm:hover{color:var(--accent)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:12px;padding:2px 9px;white-space:nowrap;border:1px solid transparent}
.p-grey{background:#f0efec;color:var(--ink2)}
.p-blue{background:var(--accent-soft);color:#1c5cab}
.p-good{background:#eaf6ea;color:var(--good-ink)}
.p-warn{background:#fff4d9;color:#7a5600}
.p-crit{background:#fdecec;color:#a52222}
.p-brand{background:var(--brand-soft);color:var(--brand-ink)}
.tier{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;border:1px solid var(--line2);color:var(--ink2)}
.tier.t1{border-color:#e8a7a2;color:var(--brand-ink);background:#fff6f5}
.risk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.risk i{width:10px;height:10px;display:inline-block;flex:none}
.risk.High i{background:var(--critical);clip-path:polygon(50% 0,100% 100%,0 100%)}
.risk.Medium i{background:var(--warn);transform:rotate(45deg);width:9px;height:9px}
.risk.Low i{background:var(--good);border-radius:50%}
.risk.na i{background:var(--grid);border-radius:2px}
.bar{height:6px;background:#eeeee9;border-radius:4px;overflow:hidden;display:flex;gap:2px}
.bar span{display:block;height:100%;border-radius:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:-4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-size:12px;fill:var(--ink2)}
svg.chart .lab{fill:var(--ink)}
svg.chart .val{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
svg.chart .sub{fill:var(--muted);font-size:11.5px}
svg.chart .ax{fill:var(--muted);font-size:11px}
svg.chart .grid{stroke:var(--grid);stroke-width:1}
svg.chart .base{stroke:var(--axis);stroke-width:1}
svg.chart [data-tip]{cursor:default}
svg.chart [data-tip]:hover{opacity:.85}
#tip{position:fixed;pointer-events:none;background:#1b1b1a;color:#fff;font-size:12px;line-height:1.4;padding:7px 10px;border-radius:7px;white-space:pre-line;z-index:100;opacity:0;transition:opacity .08s;max-width:260px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(20,20,19,.32);z-index:50;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(620px,96vw);background:#fff;z-index:60;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s ease;box-shadow:-12px 0 32px rgba(0,0,0,.12)}
.drawer.open{transform:none}
.drawer .dh{padding:18px 24px 14px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-size:18px}
.drawer .db{padding:20px 24px;overflow:auto;flex:1}
.drawer .df{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.drawer .df .sp{flex:1}
.steps{display:flex;gap:6px;margin-top:12px}
.steps div{flex:1;font-size:12px;color:var(--muted);border-top:3px solid var(--grid);padding-top:6px;font-weight:500}
.steps div.on{color:var(--ink);border-color:var(--brand);font-weight:600}
.steps div.done{color:var(--ink2);border-color:#e8a7a2}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line2);border-radius:10px;padding:12px 14px;background:#fff;text-align:left;width:100%}
.opt:hover{border-color:var(--ink2)}
.opt.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft);background:#fffafa}
.opt b{display:block}.opt small{color:var(--ink2)}
.callout{border:1px solid #b7d3f6;background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:13px}
.callout.warn{border-color:#f3d27a;background:#fff8e6}
.callout.crit{border-color:#f0b2b2;background:#fdf3f3}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--ink2)}.kv dd{margin:0;font-weight:500}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
.chk input{margin-top:3px}
.chk b{display:block;font-size:13.5px}.chk small{color:var(--ink2);font-size:12px}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1b1b1a;color:#fff;padding:10px 16px;border-radius:9px;font-size:13.5px;opacity:0;transition:.2s;z-index:120}
#toast.on{opacity:1;transform:translateX(-50%)}

/* Response review */
.ans{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.ans.flagged{border-color:#f0b2b2;background:#fffafa}
.ans.accepted{border-color:#b9e0b9}
.ans .qq{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:4px}
.ans .qt{font-weight:600;margin-bottom:8px}
.ans .aa{background:#f8f8f6;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.ans .ab{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.doc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line2);border-radius:6px;padding:3px 8px;background:#fff}
.thread{margin-top:10px;border-top:1px dashed var(--line2);padding-top:10px}
.msg{display:flex;gap:8px;margin-bottom:8px;font-size:13px}
.msg .who{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.msg.you .who{background:#e3efe0;color:#2f6b25}
.msg.sup .who{background:#e8f1fc;color:#1c5cab}
.msg .tx{background:#f6f6f3;border-radius:8px;padding:6px 10px}
.msg small{display:block;color:var(--muted);font-size:11px}
.compose{display:flex;gap:8px}
.sticky{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-top:16px;box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.side2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}

/* Board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{background:#efefeb;border-radius:10px;padding:10px}
.col h4{font-size:13px;padding:2px 4px 10px;display:flex;justify-content:space-between;color:var(--ink2)}
.tcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.tcard b{display:block;font-size:13.5px;margin-bottom:4px}
.tcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2)}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 20px;font-size:13px}
.timeline li:before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--axis)}
.timeline li:after{content:"";position:absolute;left:7.5px;top:16px;bottom:0;width:1px;background:var(--grid)}
.timeline li:last-child:after{display:none}
.timeline small{display:block;color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:13px}
.prof{display:flex;gap:16px;align-items:center}
.prof .big{width:52px;height:52px;border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:18px}
.lens{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.lens .card{padding:14px 16px}
.lens b{font-size:20px;font-weight:650}
.lens small{display:block;color:var(--ink2);font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted)}
.codeinfo{cursor:help;border-bottom:1px dotted var(--muted)}
@media (max-width:1100px){.grid2,.grid3,.needs,.lens,.board{grid-template-columns:1fr 1fr}.side2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top">
      <label class="search"><svg viewBox="0 0 24 24"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3"/></svg><input id="gsearch" placeholder="Search suppliers, assessments, questions" autocomplete="off"></label>
      <span class="sample" title="This prototype uses sample data">Prototype · sample data</span>
      <span class="sp"></span>
      <select class="inp" id="year" aria-label="Programme year"><option>2026</option><option>2025</option></select>
      <button class="iconbtn" data-act="notif" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot" id="bellcount"></span></button>
      <div class="me" data-act="memenu"><span class="av">PS</span><span><b>Prajal Sakhala</b><small>Client admin</small></span>
        <div class="menu" id="memenu"><a href="#/settings/users">My profile</a><a href="#/settings">Settings</a><button data-act="signout">Sign out</button></div>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div class="scrim" id="scrim" data-act="closeDrawer"></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog"></aside>
<div id="tip"></div>
<div id="toast"></div>

<script>
/* ============ DATA (sample) ============ */
const TODAY = new Date('2026-11-24T09:00:00');
const AREAS = ['Carbon & Energy','Scope 3','Water','Waste & Circularity','Responsible Sourcing','Labour, Health & Safety','Ethics & Compliance'];
const AREA_SHORT = ['Carbon','Scope 3','Water','Waste','Sourcing','Labour','Ethics'];
const MAT = [
  {name:'Nascent',min:0,c:'#86b6ef',def:'Little or no formal ESG approach'},
  {name:'Emerging',min:60,c:'#5598e7',def:'Awareness exists; practices ad hoc'},
  {name:'Developing',min:70,c:'#2a78d6',def:'Formal processes, limited impact'},
  {name:'Progressive',min:80,c:'#1c5cab',def:'Strong practices, measurable outcomes'},
  {name:'Transformative',min:90,c:'#104281',def:'ESG embedded in the core business'}];
const C1='#2a78d6', C2='#eb6834', GREY='#a9a8a2';

let SUP = [
 {id:'SUP-007',name:'Amaraja Batteries',tier:1,cat:'Primary cells & batteries',city:'Bhusawal',spend:180,contact:'R. Kulkarni',email:'esg@amaraja.example',fac:'Pune Plant 1',score:null,areas:null,prev:null,conf:null,comp:null,added:'2026-11-04'},
 {id:'SUP-008',name:'Kavya Castings',tier:1,cat:'Metal castings',city:'Kolhapur',spend:240,contact:'S. Patil',email:'quality@kavya.example',fac:'Pune Plant 1',score:48,areas:[42,30,55,50,45,58,56],prev:41,conf:62,comp:75,added:'2025-08-12'},
 {id:'SUP-009',name:'Sharda Polymers',tier:1,cat:'Medical-grade polymers',city:'Vapi',spend:320,contact:'A. Shah',email:'compliance@sharda.example',fac:'Vapi Unit',score:74,areas:[80,62,78,70,72,76,80],prev:66,conf:84,comp:100,added:'2025-08-12'},

}

/* ============ CHARTS (inline SVG) ============ */
function funnelSvg(st,single){
  const W=560,rowH=36,lab=86,maxW=330,H=st.length*rowH+4;
  const max=Math.max(1,...st.map(s=>s.t1+s.t2));let g='';
  st.forEach((s,i)=>{
    const y=i*rowH, tot=s.t1+s.t2, w1=s.t1/max*maxW, w2=s.t2/max*maxW;
    g+=`<text x="0" y="${y+20}" class="lab">${s.name}</text>`;
    if(tot===0) g+=`<rect x="${lab}" y="${y+7}" width="2" height="20" fill="${GREY}"/>`;
    if(w1>0) g+=`<rect x="${lab}" y="${y+7}" width="${Math.max(w1,3)}" height="20" rx="4" fill="${single?C1:C1}"${tip(`${s.name}\nTier 1: ${s.t1}`)}/>`;
    if(w2>0) g+=`<rect x="${lab+w1+(w1>0?2:0)}" y="${y+7}" width="${Math.max(w2-(w1>0?2:0),3)}" height="20" rx="4" fill="${single?C1:C2}"${tip(`${s.name}\nTier 2: ${s.t2}`)}/>`;
    g+=`<text x="${lab+w1+w2+8}" y="${y+21}" class="val">${tot}</text>`;
    if(i>0){const p=st[i-1].t1+st[i-1].t2;const pct=p?Math.round(tot/p*100):0;const drop=p-tot;
      g+=`<text x="${W}" y="${y+21}" text-anchor="end" class="${drop>0&&pct<80?'val':'sub'}" ${drop>0&&pct<80?'style="fill:#a52222"':''}>${drop>0?`−${drop} · `:''}${pct}% carry on</text>`}
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Assessment progress funnel">${g}</svg>`;
}
function riskSvg(list){
  const W=560,H=330,l=58,r=14,t=10,b=44,pw=W-l-r,ph=H-t-b;
  const maxS=Math.max(400,Math.ceil(Math.max(...list.map(s=>s.spend))/100)*100);
  const X=v=>l+v/100*pw, Y=v=>t+ph-v/maxS*ph, thS=SETTINGS.highSpend, thP=60;
  let g=`<rect x="${l}" y="${t}" width="${X(thP)-l}" height="${Y(thS)-t}" fill="${C1}" fill-opacity=".08"/>`;
  for(let v=0;v<=100;v+=20) g+=`<line x1="${X(v)}" y1="${t}" x2="${X(v)}" y2="${t+ph}" class="grid"/><text x="${X(v)}" y="${t+ph+16}" text-anchor="middle" class="ax">${v}</text>`;
  for(let v=0;v<=maxS;v+=100) g+=`<line x1="${l}" y1="${Y(v)}" x2="${l+pw}" y2="${Y(v)}" class="grid"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end" class="ax">${v?inr(v):'0'}</text>`;
  g+=`<line x1="${X(thP)}" y1="${t}" x2="${X(thP)}" y2="${t+ph}" stroke="var(--axis)" stroke-dasharray="4 3"/><line x1="${l}" y1="${Y(thS)}" x2="${l+pw}" y2="${Y(thS)}" stroke="var(--axis)" stroke-dasharray="4 3"/>`;
  g+=`<text x="${l+8}" y="${t+18}" class="lab" style="font-weight:650;fill:#1c5cab">Engage first</text><text x="${l+8}" y="${t+33}" class="sub">high spend, score below ${thP}</text>`;
  g+=`<text x="${l+pw-8}" y="${t+18}" text-anchor="end" class="sub">Strategic and strong</text><text x="${l+8}" y="${t+ph-8}" class="sub">Develop</text><text x="${l+pw-8}" y="${t+ph-8}" text-anchor="end" class="sub">Low risk</text>`;
  g+=`<text x="${l+pw/2}" y="${H-4}" text-anchor="middle" class="ax">ESG performance score (0–100) →</text><text transform="translate(12 ${t+ph/2}) rotate(-90)" text-anchor="middle" class="ax">Annual spend →</text>`;
  list.forEach(s=>{const eng=s.spend>=thS&&s.score<thP;const cx=X(s.score),cy=Y(s.spend);
    g+=`<a href="#/suppliers/${s.id}"><circle cx="${cx}" cy="${cy}" r="7" fill="${eng?C1:GREY}" stroke="#fff" stroke-width="2"${tip(`${s.name} · Tier ${s.tier}\nScore ${s.score} · Spend ${inr(s.spend)}\nData confidence ${s.conf}%`)}/></a>`;
    if(eng) g+=`<text x="${cx+11}" y="${cy+4}" class="lab" style="font-weight:600">${esc(s.name)}</text>`;});

   <div class="seg">${[['all','All tiers'],['1','Tier 1'],['2','Tier 2']].map(([k,l])=>`<button data-act="supTier" data-arg="${k}" class="${f.tier===k?'on':''}">${l}</button>`).join('')}</div>
   <div class="seg">${[['all','Any risk'],['High','High'],['Medium','Medium'],['Low','Low'],['none','Not assessed']].map(([k,l])=>`<button data-act="supRisk" data-arg="${k}" class="${f.risk===k?'on':''}">${l}</button>`).join('')}</div>
   ${state.sel.size?`<span style="margin-left:auto;display:flex;gap:8px;align-items:center"><b>${state.sel.size} selected</b><button class="btn sm" data-act="bulkAdd">Add to assessment</button><button class="btn sm pri" data-act="bulkInvite">Invite to onboarding</button></span>`:''}</div>
  <table class="tbl"><thead><tr><th style="width:30px"><input type="checkbox" data-act="selAll" ${state.sel.size&&state.sel.size===rows.length?'checked':''}></th><th>Supplier</th><th>Tier</th><th class="num">Annual spend</th><th>Onboarding</th><th class="num">ESG score</th><th>Maturity</th><th>Risk</th><th class="num">Open items</th></tr></thead><tbody>
  ${rows.map(s=>{const o=onbOf(s);return `<tr><td><input type="checkbox" data-act="sel" data-arg="${s.id}" ${state.sel.has(s.id)?'checked':''}></td>
   <td><a class="nm" href="#/suppliers/${s.id}">${esc(s.name)}</a><small>${esc(s.cat)} · ${esc(s.city)}</small></td><td>${tierHtml(s.tier)}</td><td class="num">${inr(s.spend)}</td>
   <td>${o?stHtml(o):'—'}</td><td class="num">${s.score??'—'}</td><td>${matHtml(s.score)}</td><td>${riskHtml(riskOf(s))}</td><td class="num">${openItems(s)||'—'}</td></tr>`}).join('')||`<tr><td colspan="9" class="empty">No suppliers match these filters.</td></tr>`}
  </tbody></table>`;
};
function supProfile(id,tab){
  const s=sup(id);if(!s) return `<div class="empty">Supplier not found.</div>`;
  const r=riskOf(s),as=ASSIGN.filter(a=>a.sid===id),fl=FLAGS.filter(f=>f.sid===id),ac=ACTIONS.filter(a=>a.sid===id);
  const thr=Object.entries(THREADS).filter(([k])=>k.split('|')[1]===id);
  const latest=as.filter(a=>['submitted','reviewed','reopened'].includes(a.st)).sort((a,b)=>(b.aid>a.aid?1:-1))[0];
  let body='';
  if(tab==='overview'){
    const tierAvg=areaAverages(SUP.filter(x=>x.tier===s.tier&&x.score!=null));
    body=`<div class="lens" style="margin-bottom:16px">
      <div class="card"><small>Basic compliance</small><b>${s.comp!=null?s.comp+'%':'—'}</b><div class="bar" style="margin-top:8px"><span style="width:${s.comp||0}%;background:${(s.comp||0)<100?'var(--warn)':'var(--good)'}"></span></div><small style="margin-top:6px">Permits and red-flag checks passed</small></div>
      <div class="card"><small>ESG performance</small><b>${s.score??'—'}<span style="font-size:13px;color:var(--muted)"> /100</span></b><div style="margin-top:6px">${matHtml(s.score)}</div></div>
      <div class="card"><small>Year on year</small><b>${s.score!=null&&s.prev!=null?(s.score-s.prev>=0?'+':'')+(s.score-s.prev):'—'}</b><small>${s.prev!=null?`2025 score ${s.prev}`:'Baseline year'}</small></div>
      <div class="card"><small>Data confidence</small><b>${s.conf!=null?s.conf+'%':'—'}</b><div class="bar" style="margin-top:8px"><span style="width:${s.conf||0}%;background:${C1}"></span></div><small style="margin-top:6px">${s.conf==null?'No evidence yet':s.conf<60?'Low · scores lean on unverified claims':s.conf<80?'Medium':'High'}</small></div></div>
     <div class="grid2"><div class="card"><h3>${s.areas?`Strongest in ${AREAS[s.areas.indexOf(Math.max(...s.areas.filter(v=>v!=null)))]}, weakest in ${AREAS[s.areas.indexOf(Math.min(...s.areas.filter(v=>v!=null)))]}`:'No scored annual assessment yet'}</h3><p class="q">Score by area · black tick = Tier ${s.tier} average</p>
       ${s.areas?hbarSvg(s.areas.map((v,i)=>({l:AREAS[i],v:v??0,vl:v??'n/a',c:v==null?GREY:C1,mark:v==null?null:tierAvg[i],tip:`${AREAS[i]}: ${v??'not scored'}`})),{max:100,lab:180,markLabel:`Tier ${s.tier} average`}):`<div class="empty">Scores appear after the first Annual ESG Assessment is submitted.</div>`}</div>
      <div class="card"><h3>Red flags and compliance</h3><p class="q">A check passes only with accepted evidence</p>
       ${fl.length?fl.map(f=>`<div class="chk"><span class="risk High"><i></i></span><span><b>${esc(f.text)}</b><small>${esc(f.cause)} · ${esc(asm(f.aid).title)} · ${f.status}</small></span></div>`).join(''):`<div class="empty">No red flags.</div>`}
       <dl class="kv" style="margin-top:14px"><dt>Contact</dt><dd>${esc(s.contact)} · ${esc(s.email)}</dd><dt>Facility</dt><dd>${esc(s.fac)}</dd><dt>Products / services</dt><dd>${esc(s.cat)}</dd><dt>Added</dt><dd>${fd(s.added)}</dd></dl></div></div>`;
  } else if(tab==='assessments'){
    body=`<table class="tbl"><thead><tr><th>Assessment</th><th>Period</th><th>Status</th><th>Due</th><th class="num">Answered</th><th></th></tr></thead><tbody>${as.map(a=>{const A=asm(a.aid);return `<tr><td><a class="nm" href="#/assessments/${A.id}">${esc(A.title)}</a><small>${A.type}</small></td><td>${A.period}</td><td>${stHtml(a)}</td><td>${fd(a.due)}</td><td class="num">${a.answered}/${A.q}</td><td>${['submitted','reviewed','reopened'].includes(a.st)?`<a class="link" href="#/response/${A.id}/${id}">Open response</a>`:a.st==='not_invited'?`<button class="btn sm pri" data-act="inviteOne" data-arg="${A.id}|${id}">Invite</button>`:''}</td></tr>`}).join('')}</tbody></table>`;
  } else if(tab==='evidence'){
    const ev=EVIDENCE.filter(e=>e.sid===id);
    body=`<div class="card"><h3>Documents and answers</h3><p class="q">Evidence uploaded with each assessment. Review it on the response page, next to the answer it supports.</p>${ev.length?ev.map(e=>`<div class="chk"><span class="doc">📄 ${esc(e.file)}</span><span><b>${esc(e.q)}</b><small>${esc(asm(e.aid).title)} · uploaded ${fd(e.at)} · ${e.st}</small></span><a class="link" style="margin-left:auto" href="#/response/${e.aid}/${id}">Review</a></div>`).join(''):`<div class="empty">No documents waiting for review.</div>`}${latest?`<a class="btn" href="#/response/${latest.aid}/${id}">Open latest response →</a>`:''}</div>`;
  } else if(tab==='flags'){
    body=`<div class="grid2"><div class="card"><h3>Red flags</h3><p class="q">Each red flag links to its improvement action</p>${fl.map(f=>`<div class="chk"><span class="risk High"><i></i></span><span><b>${esc(f.text)}</b><small>${esc(f.cause)} · ${f.status}</small></span>${f.status==='Open'?`<button class="btn sm" style="margin-left:auto" data-act="raiseAction" data-arg="${f.id}">Raise action</button>`:''}</div>`).join('')||'<div class="empty">No red flags.</div>'}</div>
     <div class="card"><h3>Improvement actions</h3><p class="q">Tracked into next year's score</p>${ac.map(a=>`<div class="chk"><span><b>${esc(a.title)}</b><small>${a.st} · due ${fd(a.due)} · owner ${esc(a.owner)}</small></span></div>`).join('')||'<div class="empty">No actions.</div>'}</div></div>`;
  } else if(tab==='qa'){
    body=`<div class="card"><h3>Questions and answers</h3><p class="q">Every thread with this supplier, on any answer</p>${thr.length?thr.map(([k,m])=>{const [aid,,c]=k.split('|');const q=QBANK.find(x=>x.code===c);return `<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><b>${esc(q?q.t:c)}</b><a class="link" style="margin-left:auto;font-size:13px" href="#/response/${aid}/${id}">Open in response →</a></div>${m.map(msgHtml).join('')}</div>`}).join(''):`<div class="empty">No questions yet. Ask one from any answer on the response page.</div>`}</div>`;
  } else {
    body=`<div class="card"><ul class="timeline">${[
      ...as.filter(a=>a.st!=='not_invited').map(a=>({d:a.due,t:`${ST_LABEL[a.st]} · ${asm(a.aid).title}`})),
      ...fl.map(f=>({d:'2026-11-01',t:`Red flag raised: ${f.text}`})),
      {d:s.added,t:'Supplier added'}].sort((a,b)=>(b.d||'')>(a.d||'')?1:-1).map(x=>`<li>${esc(x.t)}<small>${fd(x.d)}</small></li>`).join('')}</ul></div>`;
  }
  return head(`<span class="prof"><span class="big">${initials(s.name)}</span><span>${esc(s.name)} <span style="font-size:13px;font-weight:500">${tierHtml(s.tier)}</span><span style="display:block;font-size:13px;font-weight:400;color:var(--ink2);margin-top:4px">${s.id} · ${esc(s.cat)} · ${esc(s.city)} · spend ${inr(s.spend)} · ${riskHtml(r)}</span></span></span>`,'',
    `<button class="btn" data-act="toastMsg" data-arg="Edit supplier details">Edit</button><button class="btn" data-act="openAsk" data-arg="${id}">Ask a question</button><button class="btn pri" data-act="bulkAdd" data-arg="${id}">Add to assessment</button>`,`<a href="#/suppliers">Suppliers</a> / ${esc(s.name)}`)+
   tabs(`suppliers/${id}`,[['overview','Overview'],['assessments','Assessments',as.length],['evidence','Answers & evidence'],['flags','Red flags & actions',fl.length+ac.length],['qa','Q&A',thr.length],['activity','Activity']],tab)+body;
}

/* ---- Assessments ---- */
P.assessments=(id,tab)=>{
  if(id&&!['active','drafts','closed'].includes(id)) return asmDetail(id,tab||'progress');
  const t=id||'active';const map={active:'Active',drafts:'Draft',closed:'Closed'};
  const list=ASSESS.filter(a=>a.status===map[t]);
  return head('Assessments','Each assessment sends one questionnaire to the suppliers you choose, with one due date',`<button class="btn pri" data-act="newAssess">+ New assessment</button>`)+
  tabs('assessments',[['active','Active',ASSESS.filter(a=>a.status==='Active').length],['drafts','Drafts',ASSESS.filter(a=>a.status==='Draft').length],['closed','Closed',ASSESS.filter(a=>a.status==='Closed').length]],t)+
  `<table class="tbl"><thead><tr><th>Assessment</th><th>Type</th><th style="width:260px">Progress</th><th>Due</th><th class="num">Avg score</th><th class="num">Red flags</th><th></th></tr></thead><tbody>
  ${list.map(a=>{const as=ASSIGN.filter(x=>x.aid===a.id);const tot=a.type==='Materiality'?SURVEY.reduce((s,x)=>s+x.of,0):as.length;const sub=a.type==='Materiality'?SURVEY.reduce((s,x)=>s+x.done,0):as.filter(x=>['submitted','reviewed','reopened'].includes(x.st)).length;const rev=as.filter(x=>x.st==='reviewed').length;const ni=as.filter(x=>x.st==='not_invited').length;
   const sc=avg(as.filter(x=>x.st==='reviewed'||x.st==='submitted').map(x=>a.type==='Annual ESG'?sup(x.sid).score:null));const fl=FLAGS.filter(f=>f.aid===a.id&&f.status!=='Closed').length;
   return `<tr><td><a class="nm" href="#/assessments/${a.id}">${esc(a.title)}</a><small>${a.period}${a.tier?` · Tier ${a.tier}`:a.type==='Materiality'?' · Stakeholders':''} · ${a.q} questions</small></td><td><span class="pill ${a.type==='Materiality'?'p-blue':a.type==='Onboarding'?'p-grey':'p-brand'}">${a.type}</span></td>
   <td>${tot?`<div class="bar" style="height:8px">${rev&&a.type!=='Materiality'?`<span style="width:${rev/tot*100}%;background:var(--good)"></span>`:''}<span style="width:${(sub-(a.type==='Materiality'?0:rev))/tot*100}%;background:${C1}"></span></div><small style="margin-top:4px">${sub} of ${tot} ${a.type==='Materiality'?'responses':'submitted'}${rev&&a.type!=='Materiality'?` · ${rev} reviewed`:''}${ni?` · <span style="color:#a52222">${ni} not invited</span>`:''}</small>`:'<small>No suppliers yet</small>'}</td>
   <td>${a.due?`${fd(a.due)}${isOverdue(a.due)&&a.status==='Active'?' <span class="pill p-crit">Past due</span>':''}`:'—'}</td><td class="num">${sc!=null?Math.round(sc):'—'}</td><td class="num">${fl||'—'}</td><td><a class="link" href="#/assessments/${a.id}">Open</a></td></tr>`}).join('')||`<tr><td colspan="7" class="empty">Nothing here yet.</td></tr>`}
  </tbody></table>`;
};
function asmDetail(id,tab){
  const a=asm(id);if(!a) return '<div class="empty">Not found</div>';
  if(a.type==='Materiality') {location.hash='#/materiality/survey';return ''}
  const as=ASSIGN.filter(x=>x.aid===id);const ni=as.filter(x=>x.st==='not_invited');
  let body='';
  if(tab==='progress'){
    const st=stages(as);
    body=`<div class="grid2"><div class="card"><h3>${st[3].t1+st[3].t2} of ${as.length} suppliers have submitted</h3><p class="q">Where suppliers are in this assessment</p>${funnelSvg(st,true)}</div>
     <div class="stack">${ni.length?`<div class="callout crit"><b>${ni.length} supplier${ni.length>1?'s have':' has'} not been invited.</b> ${ni.map(x=>esc(sup(x.sid).name)).join(', ')} won't hear from you until you send the invite.<div style="margin-top:10px"><button class="btn sm pri" data-act="inviteAll" data-arg="${id}">Invite ${ni.length} now, due ${fds(addDays(SETTINGS.onbDays))}</button></div></div>`:''}
     <div class="card"><h3>Key dates</h3><p class="q">Reminders go out on these dates to suppliers who haven't submitted</p><ul class="timeline">${a.started?`<li>Started<small>${fd(a.started)}</small></li>`:''}${SETTINGS.remind.map(d=>{const x=new Date(a.due+'T00:00:00');x.setDate(x.getDate()-d);return `<li>Reminder, ${d} day${d>1?'s':''} before<small>${fd(x.toISOString().slice(0,10))}${x<TODAY?' · sent':''}</small></li>`}).join('')}<li><b>Due</b><small>${fd(a.due)}${isOverdue(a.due)?' · past due':''}</small></li><li>Escalation to admins<small>${SETTINGS.escalate} days after the due date</small></li></ul></div></div></div>`;
  } else if(tab==='suppliers'){
    body=`<div class="filters"><span style="color:var(--ink2)">${as.length} suppliers in this assessment</span><button class="btn sm" style="margin-left:auto" data-act="bulkAdd" data-arg="">+ Add suppliers</button></div>
    <table class="tbl"><thead><tr><th>Supplier</th><th>Status</th><th>Due</th><th style="width:150px">Progress</th><th class="num">Score</th><th>Risk</th><th class="num">Open items</th><th></th></tr></thead><tbody>${as.map(x=>{const s=sup(x.sid);return `<tr><td><a class="nm" href="#/suppliers/${s.id}">${esc(s.name)}</a><small>Tier ${s.tier}</small></td><td>${stHtml(x)}</td><td>${fd(x.due)}</td><td><div class="bar"><span style="width:${x.answered/a.q*100}%;background:${C1}"></span></div><small>${x.answered}/${a.q} answered</small></td><td class="num">${a.type==='Annual ESG'&&['submitted','reviewed'].includes(x.st)?s.score:'—'}</td><td>${riskHtml(riskOf(s))}</td><td class="num">${openItems(s)||'—'}</td><td>${x.st==='not_invited'?`<button class="btn sm pri" data-act="inviteOne" data-arg="${id}|${s.id}">Invite</button>`:['submitted','reviewed','reopened'].includes(x.st)?`<a class="link" href="#/response/${id}/${s.id}">${x.st==='submitted'?'Review':'Open'}</a>`:`<button class="btn sm" data-act="toastMsg" data-arg="Reminder sent to ${esc(s.name)}">Remind</button>`}</td></tr>`}).join('')}</tbody></table>`;
  } else if(tab==='results'){
    const sc=as.filter(x=>['submitted','reviewed'].includes(x.st)).map(x=>sup(x.sid)).filter(s=>s.score!=null);
    body=a.type!=='Annual ESG'?`<div class="card"><h3>Onboarding checks</h3><p class="q">Onboarding is pass/fail on compliance; it isn't scored for maturity.</p>${hbarSvg([{l:'Passed all checks',v:as.filter(x=>x.st==='reviewed'&&!openFlags(x.sid).length).length,c:C1},{l:'Red flag raised',v:new Set(FLAGS.filter(f=>f.aid===id).map(f=>f.sid)).size},{l:'Not submitted yet',v:as.filter(x=>!['submitted','reviewed','reopened'].includes(x.st)).length}])}</div>`:
    `<div class="grid2"><div class="card"><h3>Average score ${Math.round(avg(sc.map(s=>s.score)))} across ${sc.length} suppliers</h3><p class="q">Score by supplier, highest first</p>${hbarSvg(sc.sort((p,q)=>q.score-p.score).map(s=>({l:s.name,v:s.score,c:maturity(s.score).c,tip:`${s.name}: ${s.score} · ${maturity(s.score).name}`})),{max:100})}</div>
     <div class="card"><h3>Average by area</h3><p class="q">Where this group is strong and weak</p>${hbarSvg(areaAverages(sc).map((v,i)=>({l:AREAS[i],v:v==null?0:Math.round(v),vl:v==null?'n/a':Math.round(v),c:GREY})),{max:100,lab:180})}</div></div>`;
  } else {
    body=`<div class="grid2"><div class="card"><h3>Questions</h3><p class="q">${a.q} questions from the ${a.type} template for Tier ${a.tier}</p><dl class="kv"><dt>Required</dt><dd>All red-flag and evidence questions</dd><dt>Questionnaire</dt><dd><a class="link" href="#/questionnaires/bank">View in question bank</a></dd><dt>Compared with</dt><dd>${a.type} · Tier ${a.tier} · previous period (automatic)</dd></dl></div>
    <div class="card"><h3>Reminders and message</h3><p class="q">Applies to every supplier in this assessment</p><dl class="kv"><dt>Reminders</dt><dd>${SETTINGS.remind.join(', ')} days before the due date</dd><dt>Escalation</dt><dd>${SETTINGS.escalate} days overdue → client admins</dd><dt>Message</dt><dd style="font-weight:400">Please complete this assessment by the due date. Use the question icon on any answer if something is unclear.</dd></dl><div style="margin-top:12px;display:flex;gap:8px"><button class="btn sm" data-act="toastMsg" data-arg="Export started">Export responses</button><button class="btn sm bad" data-act="toastMsg" data-arg="Assessment closed">Close assessment</button></div></div></div>`;
  }
  return head(esc(a.title),`${a.type} · ${a.period}${a.tier?` · Tier ${a.tier}`:''} · due ${fd(a.due)}`,`<button class="btn" data-act="toastMsg" data-arg="Reminder sent to suppliers who haven't submitted">Send reminder now</button><button class="btn pri" data-act="bulkAdd" data-arg="">+ Add suppliers</button>`,`<a href="#/assessments">Assessments</a> / ${esc(a.title)}`)+
   tabs(`assessments/${id}`,[['progress','Progress'],['suppliers','Suppliers',as.length],['results','Results'],['settings','Settings']],tab)+body;
}

/* ---- Reviews ---- */
P.reviews=(tab)=>{
  tab=tab||'responses';const n=needs();
  const subm=activeAssign().filter(a=>a.st==='submitted');
  let body='';
  if(tab==='responses') body=`<table class="tbl"><thead><tr><th>Supplier</th><th>Assessment</th><th>Submitted</th><th class="num">Score</th><th>Risk</th><th>Waiting on</th><th></th></tr></thead><tbody>${subm.map(x=>{const s=sup(x.sid),A=asm(x.aid);const ev=EVIDENCE.filter(e=>e.sid===s.id&&e.aid===A.id&&e.st==='Pending').length;return `<tr><td><a class="nm" href="#/suppliers/${s.id}">${esc(s.name)}</a><small>Tier ${s.tier}</small></td><td>${esc(A.title)}</td><td>${fd('2026-11-2'+(s.id.slice(-1)))}</td><td class="num">${s.score??'—'}</td><td>${riskHtml(riskOf(s))}</td><td>${ev?`${ev} document${ev>1?'s':''} to verify`:'Your review'}</td><td><a class="btn sm pri" href="#/response/${A.id}/${s.id}">Review</a></td></tr>`}).join('')||`<tr><td colspan="7" class="empty">Nothing waiting for review.</td></tr>`}</tbody></table>`;
  else if(tab==='evidence') body=`<table class="tbl"><thead><tr><th>Document</th><th>Supplier</th><th>Supports the answer to</th><th>Uploaded</th><th></th></tr></thead><tbody>${EVIDENCE.filter(e=>e.st==='Pending').map(e=>`<tr><td><span class="doc">📄 ${esc(e.file)}</span></td><td><a class="nm" href="#/suppliers/${e.sid}">${esc(sup(e.sid).name)}</a></td><td>${esc(e.q)}<small>${esc(asm(e.aid).title)}</small></td><td>${fd(e.at)}</td><td style="white-space:nowrap"><button class="btn sm ok" data-act="evid" data-arg="${e.id}|Accepted">Accept</button> <button class="btn sm bad" data-act="evid" data-arg="${e.id}|Rejected">Reject</button> <a class="link" style="margin-left:6px" href="#/response/${e.aid}/${e.sid}">In context</a></td></tr>`).join('')||`<tr><td colspan="5" class="empty">No documents to verify.</td></tr>`}</tbody></table><p class="hint">Accept only if the document is valid, legible, in the supplier's name, in date, and supports the answer. Accepted documents raise data confidence.</p>`;
  else if(tab==='clarifications') body=Object.entries(THREADS).map(([k,m])=>{const [aid,sid,c]=k.split('|');const q=QBANK.find(x=>x.code===c);const last=m.at(-1);return `<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><b>${esc(sup(sid).name)}</b><span style="color:var(--ink2)">on “${esc(q?q.t:c)}”</span><span class="pill ${last.who==='sup'?'p-brand':'p-grey'}" style="margin-left:auto">${last.who==='sup'?'Awaiting your reply':'Awaiting supplier'}</span></div>${m.map(msgHtml).join('')}<a class="link" href="#/response/${aid}/${sid}">Reply in the response →</a></div>`}).join('');
  else body=`<table class="tbl"><thead><tr><th>Red flag</th><th>Supplier</th><th>Cause</th><th>Assessment</th><th>Status</th><th></th></tr></thead><tbody>${FLAGS.filter(f=>f.status!=='Closed').map(f=>`<tr><td><span class="risk High"><i></i></span> ${esc(f.text)}</td><td><a class="nm" href="#/suppliers/${f.sid}">${esc(sup(f.sid).name)}</a></td><td>${esc(f.cause)}</td><td>${esc(asm(f.aid).title)}</td><td>${f.status==='Open'?'<span class="pill p-crit">Open</span>':'<span class="pill p-grey">Action raised</span>'}</td><td>${f.status==='Open'?`<button class="btn sm pri" data-act="raiseAction" data-arg="${f.id}">Raise action</button>`:`<a class="link" href="#/actions">View action</a>`}</td></tr>`).join('')}</tbody></table>`;
  return head('Reviews','Everything waiting on your team, in one inbox')+tabs('reviews',[['responses','Responses',n.review],['evidence','Evidence',n.evidence],['clarifications','Clarifications',n.clar],['flags','Red flags',n.flags]],tab)+body;
};
function msgHtml(m){return `<div class="msg ${m.who==='you'?'you':'sup'}"><span class="who">${initials(m.name)}</span><div class="tx">${esc(m.text)}<small>${esc(m.name)} · ${fd(m.at)}</small></div></div>`}

/* ---- Response review ---- */
function answerFor(s,q){
  const v=q.area!=null&&s.areas?s.areas[q.area]:s.score;
  if(q.type==='Text') return q.code==='OB-01'?s.name:q.code==='OB-02'?`${s.city}, ${s.city==='Pune'?'Maharashtra':'India'}`:s.cat;
  if(q.code==='OB-05') return FLAGS.some(f=>f.sid===s.id&&f.code==='OB-05')?'Yes, we hold a valid CTO — renewal in process':'Yes, we hold a valid CTO (expires Mar 2028)';
  if(q.code==='OB-08') return FLAGS.some(f=>f.sid===s.id&&f.code==='OB-08')?'Yes — penalty or legal notice received (details in remarks)':'No penalties in the past 3 years';
  if(q.code==='S-03') return FLAGS.some(f=>f.sid===s.id&&f.code==='S-03')?'Partly — overtime limits exceeded in some months':'Yes, audited annually';
  if(v==null) return 'Not applicable for this tier';
  return v>=80?'D — Leading practice, verified':v>=65?'C — Formal system in place, partly verified':v>=45?'B — Some practice, not yet formal':'A — Not in place';
}
P.response=(aid,sid)=>{
  const A=asm(aid),s=sup(sid),x=ASSIGN.find(y=>y.aid===aid&&y.sid===sid);if(!A||!s||!x) return '<div class="empty">Response not found</div>';
  const base=QBANK.filter(q=>q.tpl===A.type&&q.tiers.includes(s.tier));
  const extraCodes=new Set([...Object.keys(THREADS).filter(k=>k.startsWith(aid+'|'+sid+'|')).map(k=>k.split('|')[2]),...FLAGS.filter(f=>f.aid===aid&&f.sid===sid).map(f=>f.code),...EVIDENCE.filter(e=>e.aid===aid&&e.sid===sid).map(e=>e.code)]);
  const extra=QBANK.filter(q=>extraCodes.has(q.code)&&!base.includes(q));
  const qs=[...extra,...base];
  let acc=0,flg=0,openQ=0;
  const items=qs.map(q=>{const k=`${aid}|${sid}|${q.code}`;const ev=EVIDENCE.find(e=>e.sid===sid&&e.aid===aid&&e.code===q.code);const isRf=FLAGS.find(f=>f.sid===sid&&f.aid===aid&&f.code===q.code);
    let st=REVIEWSTATE[k]||(isRf?'flagged':(x.st==='reviewed'?'accepted':null));if(st==='accepted')acc++;if(st==='flagged')flg++;const th=THREADS[k]||[];if(th.length&&th.at(-1).who==='sup')openQ++;
    return `<div class="ans ${st||''}" id="q-${q.code}"><div class="qq">${code(q.code)}<span>${q.sec}${q.area!=null?' · '+AREAS[q.area]:''}</span>${q.rf?'<span class="pill p-crit" style="font-size:11px">Red-flag question</span>':''}${st==='accepted'?'<span class="pill p-good" style="margin-left:auto">✓ Accepted</span>':st==='flagged'?'<span class="pill p-crit" style="margin-left:auto">⚑ Flagged</span>':''}</div>
     <div class="qt">${esc(q.t)}</div><div class="aa">${esc(answerFor(s,q))}${isRf?`<div style="color:#a52222;font-size:12.5px;margin-top:4px">⚑ ${esc(isRf.text)}</div>`:''}</div>
     <div class="ab">${q.ev?(ev?`<span class="doc">📄 ${esc(ev.file)}</span><span class="pill ${ev.st==='Pending'?'p-warn':ev.st==='Accepted'?'p-good':'p-crit'}">${ev.st==='Pending'?'Document to verify':ev.st}</span>`:isRf?`<span class="pill p-crit">Document missing</span>`:`<span class="doc">📄 Evidence on file</span>`):''}
      <span style="flex:1"></span><button class="btn sm ok" data-act="rv" data-arg="${k}|accepted">Accept</button><button class="btn sm bad" data-act="rv" data-arg="${k}|flagged">Flag</button><button class="btn sm" data-act="toggleThread" data-arg="${q.code}">💬 Ask supplier${th.length?` (${th.length})`:''}</button></div>
     <div class="thread" id="th-${q.code}" style="${th.length?'':'display:none'}">${th.map(msgHtml).join('')}<div class="compose"><input class="inp" placeholder="Ask ${esc(s.contact)} about this answer…" id="in-${q.code}"><button class="btn sm pri" data-act="send" data-arg="${k}|${q.code}">Send</button></div></div></div>`}).join('');
  const r=riskOf(s);
  return head(`${esc(s.name)} · ${esc(A.title)}`,`Submitted by ${esc(s.contact)} · ${x.answered}/${A.q} answered · ${ST_LABEL[x.st]}`,`<button class="btn" data-act="toastMsg" data-arg="Score override opens here">Override score</button><a class="btn" href="#/suppliers/${sid}">Supplier profile</a>`,`<a href="#/reviews">Reviews</a> / ${esc(s.name)}`)+
  `<div class="side2"><div><p class="hint" style="margin:0 0 10px">Showing ${qs.length} sample questions. Accept, flag or ask on each answer; documents open next to the answer they support.</p>${items}
   <div class="sticky"><span><b>${acc}</b> accepted · <b>${flg}</b> flagged · <b>${openQ}</b> question${openQ===1?'':'s'} awaiting you · <b>${qs.length-acc-flg}</b> to check</span><span style="flex:1"></span><button class="btn" data-act="sendBack" data-arg="${aid}|${sid}">Send back to supplier</button><button class="btn pri" data-act="markReviewed" data-arg="${aid}|${sid}">Mark reviewed</button></div></div>
   <div class="stack"><div class="card"><h3>Scorecard</h3><p class="q">Performance = average of the area scores</p>
    <div class="lens" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px"><div><small style="color:var(--ink2)">Score</small><div style="font-size:22px;font-weight:650">${A.type==='Annual ESG'&&s.score!=null?s.score:'—'}</div>${A.type==='Annual ESG'?matHtml(s.score):'<small style="color:var(--muted)">Onboarding isn\'t scored</small>'}</div><div><small style="color:var(--ink2)">Risk</small><div style="margin-top:6px">${riskHtml(r)}</div></div><div><small style="color:var(--ink2)">Compliance</small><div style="font-size:18px;font-weight:650">${s.comp??'—'}${s.comp!=null?'%':''}</div></div><div><small style="color:var(--ink2)">Data confidence</small><div style="font-size:18px;font-weight:650">${s.conf??'—'}${s.conf!=null?'%':''}</div></div></div>
    ${A.type==='Annual ESG'&&s.areas?hbarSvg(s.areas.map((v,i)=>({l:AREA_SHORT[i],v:v??0,vl:v??'n/a',c:v==null?GREY:C1})),{max:100,lab:70,W:300}):''}</div>
    <div class="card"><h3>Activity</h3><ul class="timeline" style="margin-top:10px">${x.st==='reviewed'?'<li>Marked reviewed<small>Your team</small></li>':''}<li>Submitted<small>${esc(s.contact)} · supplier</small></li><li>Started answering<small>${esc(s.contact)}</small></li><li>Invitation sent<small>Your team · due ${fd(x.due)}</small></li><li>Added to the assessment<small>${fd(A.started)}</small></li></ul></div></div></div>`;
};

/* ---- Actions ---- */
P.actions=()=>{
  const cols=['Open','In progress','Awaiting approval','Closed'];
  return head('Improvement actions','Raised from red flags and low scores; each one is tracked into next year\'s score',`<button class="btn pri" data-act="toastMsg" data-arg="New action form opens here">+ New action</button>`)+
  `<div class="board">${cols.map(c=>{const l=ACTIONS.filter(a=>a.st===c);return `<div class="col"><h4>${c}<span>${l.length}</span></h4>${l.map(a=>{const f=FLAGS.find(x=>x.id===a.flag);const od=c!=='Closed'&&isOverdue(a.due);return `<div class="tcard"><b>${esc(a.title)}</b><div class="meta"><a class="link" href="#/suppliers/${a.sid}">${esc(sup(a.sid).name)}</a> · ${esc(a.owner)}</div><div class="meta" style="margin-top:6px">${od?'<span class="pill p-crit">Overdue</span>':''}<span>Due ${fds(a.due)}</span>${f?`<span class="pill p-grey">⚑ ${esc(f.cause)}</span>`:''}</div>${c==='Awaiting approval'?`<div style="margin-top:8px;display:flex;gap:6px"><button class="btn sm ok" data-act="actMove" data-arg="${a.id}|Closed">Approve & close</button><button class="btn sm" data-act="actMove" data-arg="${a.id}|In progress">Send back</button></div>`:''}</div>`}).join('')||'<div class="empty">None</div>'}</div>`}).join('')}</div>`;
};

/* ---- Risk & performance ---- */
P.risk=(tab)=>{
  tab=tab||'matrix';const scored=SUP.filter(s=>s.score!=null);let body='';
  if(tab==='matrix'){const eng=scored.filter(s=>s.spend>=SETTINGS.highSpend&&s.score<60);
    body=`<div class="side2"><div class="card"><h3>${eng.length} high-spend suppliers score below 60</h3><p class="q">Spend × ESG performance. Dashed lines = high-spend threshold (${inr(SETTINGS.highSpend)}) and score 60.</p>${riskSvg(scored)}</div>
    <div class="card"><h3>Engage first</h3><p class="q">Highest spend first</p>${eng.sort((a,b)=>b.spend-a.spend).map(s=>`<div class="chk"><span><b><a href="#/suppliers/${s.id}">${esc(s.name)}</a></b><small>Score ${s.score} · ${inr(s.spend)} · weakest: ${AREAS[s.areas.indexOf(Math.min(...s.areas.filter(v=>v!=null)))]}</small></span></div>`).join('')}
    <h3 style="margin-top:16px">Not yet assessed</h3><p class="q">No score yet, so not on the matrix</p>${SUP.filter(s=>s.score==null).map(s=>`<div style="font-size:13px;padding:3px 0"><a class="link" href="#/suppliers/${s.id}">${esc(s.name)}</a> <span style="color:var(--muted)">· ${inr(s.spend)}</span></div>`).join('')}</div></div>`;}
  else if(tab==='heatmap') body=`<div class="card"><h3>Supplier × area scores</h3><p class="q">Sorted by spend. Hover a cell for detail; click a name for the profile.</p>${heatLegend()}<div style="max-width:720px">${heatSvg([...scored].sort((a,b)=>b.spend-a.spend))}</div></div>`;
  else if(tab==='areas'){const i=state.rpArea;const rows=scored.filter(s=>s.areas[i]!=null).sort((a,b)=>b.areas[i]-a.areas[i]);
    body=`<div class="filters">${AREAS.map((a,k)=>`<button class="btn sm ${k===i?'pri':''}" data-act="rpArea" data-arg="${k}">${a}</button>`).join('')}</div>
    <div class="grid2"><div class="card"><h3>${AREAS[i]}: average ${Math.round(avg(rows.map(s=>s.areas[i])))} across ${rows.length} suppliers</h3><p class="q">Score by supplier, highest first${i===1?' · Tier 1 only':''}</p>${hbarSvg(rows.map(s=>({l:s.name,v:s.areas[i],c:heatC(s.areas[i]).c,tip:`${s.name} · ${AREAS[i]}: ${s.areas[i]}`})),{max:100})}</div>
    <div class="card"><h3>What this area covers</h3><p class="q">From the scoring methodology</p><p style="margin:0 0 12px">${['Scope 1 + 2 emissions, renewable electricity and climate targets','Emissions allocated to your spend and primary-data coverage (Tier 1 only)','Water withdrawal, permits, wastewater recycling or zero liquid discharge','Waste diversion, hazardous waste and chemical handling','Supplier code of conduct, due diligence and responsible minerals','Wages, working hours, human rights, safety systems and injury rates','Anti-bribery, penalties, data protection and grievance handling'][i]}</p>
    <h4 style="font-size:13px;margin-bottom:6px">Suppliers to engage</h4>${rows.filter(s=>s.areas[i]<50).map(s=>`<div style="font-size:13px;padding:3px 0"><a class="link" href="#/suppliers/${s.id}">${esc(s.name)}</a> · ${s.areas[i]}</div>`).join('')||'<div style="font-size:13px;color:var(--muted)">None below 50.</div>'}
    <p class="hint" style="margin-top:12px">Framework mappings (BRSR, EcoVadis, Scope 3) for this area are in <a class="link" href="#/reports">Reports &amp; exports</a>.</p></div></div>`;}
  else {const sl=slopeSvg(scored);const yo=scored.filter(s=>s.prev!=null).map(s=>({l:s.name,v:s.score-s.prev}));
    body=`<div class="grid2"><div class="card"><h3>${AREAS[sl.best]} improved most, +${sl.bd} points</h3><p class="q">Average area score, 2025 → 2026</p>${sl.svg}</div>
    <div class="card"><h3>${yo.filter(r=>r.v>=5).length} suppliers improved by 5+ points; ${yo.filter(r=>r.v<=-5).length} declined</h3><p class="q">Change in ESG score vs 2025 (±5 = improved / declined)</p>${hbarSvg(yo.sort((a,b)=>b.v-a.v).map(r=>({l:r.l,v:Math.abs(r.v),vl:(r.v>=0?'+':'−')+Math.abs(r.v),c:r.v>=5?'#0ca30c':r.v<=-5?'#d03b3b':GREY,tip:`${r.l}: ${r.v>=0?'+':''}${r.v} points`})),{max:10})}<div class="legend" style="margin-top:8px"><span><i style="background:#0ca30c"></i>▲ Improved</span><span><i style="background:${GREY}"></i>Steady</span><span><i style="background:#d03b3b"></i>▼ Declined</span></div></div></div>`;}
  return head('Risk & performance','Where your supply base stands, by supplier and by area')+tabs('risk',[['matrix','Risk matrix'],['heatmap','Area heatmap'],['areas','Area deep-dive'],['trends','Trends']],tab)+body;
};

/* ---- Materiality ---- */
P.materiality=(tab)=>{
  tab=tab||'matrix';let body='';const mat=TOPICS.filter(t=>t.imp>=3.5||t.fin>=3.5);
  if(tab==='matrix') body=`<div class="side2"><div class="card"><h3>${TOPICS.filter(t=>t.imp>=3.5&&t.fin>=3.5).length} topics are double material; ${mat.length} of ${TOPICS.length} are material overall</h3><p class="q">Average stakeholder rating, 1–5. Threshold 3.5 on either axis = material.</p>${matrixSvg(true)}</div>
   <div class="card"><h3>Topics</h3><p class="q">Numbers match the dots</p>${TOPICS.map(t=>`<div style="display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px"><span style="width:22px;height:22px;border-radius:50%;background:${t.imp>=3.5||t.fin>=3.5?C1:GREY};color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none">${t.n}</span>${esc(t.t)}${t.imp>=3.5&&t.fin>=3.5?'<span class="pill p-blue" style="margin-left:auto">Double</span>':''}</div>`).join('')}</div></div>`;
  else if(tab==='topics') body=`<table class="tbl"><thead><tr><th>#</th><th>Topic</th><th class="num">Impact</th><th class="num">Financial</th><th>Result</th><th>Scoring area it drives</th><th>Effect on Annual ESG</th></tr></thead><tbody>${TOPICS.map(t=>{const m=t.imp>=3.5||t.fin>=3.5;return `<tr><td>${t.n}</td><td><b>${esc(t.t)}</b></td><td class="num">${t.imp.toFixed(1)}</td><td class="num">${t.fin.toFixed(1)}</td><td>${t.imp>=3.5&&t.fin>=3.5?'<span class="pill p-blue">Double material</span>':m?'<span class="pill p-grey">Material</span>':'<span style="color:var(--muted)">Monitor</span>'}</td><td>${AREAS[t.area]}</td><td>${m?'Weight ×1.5; questions required':'Standard weight'}</td></tr>`}).join('')}</tbody></table><p class="hint">Weights are a proposal for the scoring engine; you confirm them in Questionnaires → Scoring rules before they apply.</p>`;
  else body=`<div class="grid2"><div class="card"><h3>${SURVEY.reduce((s,x)=>s+x.done,0)} of ${SURVEY.reduce((s,x)=>s+x.of,0)} stakeholders have responded</h3><p class="q">Materiality Assessment 2026 · due ${fd('2026-12-20')}</p>${hbarSvg(SURVEY.map(g=>({l:g.g,v:Math.round(g.done/g.of*100),vl:`${g.done}/${g.of}`,c:g.done/g.of<0.5?C2:C1,tip:`${g.g}: ${g.done} of ${g.of} responded`})),{max:100,lab:160})}<div style="margin-top:12px;display:flex;gap:8px"><button class="btn sm" data-act="toastMsg" data-arg="Reminder sent to 9 stakeholders who haven't responded">Remind non-responders</button><button class="btn sm" data-act="toastMsg" data-arg="Add stakeholders opens here">+ Add stakeholders</button></div></div>
   <div class="card"><h3>How it works</h3><ol style="margin:8px 0 0;padding-left:18px;line-height:1.7"><li>Pick topics: the 7 scoring areas plus sector topics.</li><li>Invite stakeholders: internal teams, selected suppliers, customers.</li><li>Each rates every topic for impact and for financial importance, 1–5.</li><li>The matrix updates as responses arrive.</li><li>Material topics weigh more in Annual ESG scoring and export to BRSR.</li></ol></div></div>`;
  return head('Materiality','Double materiality: impact on people and planet × financial importance to the business',`<button class="btn" data-act="toastMsg" data-arg="Matrix exported">Export matrix</button><button class="btn pri" data-act="newAssess" data-arg="Materiality">+ New materiality assessment</button>`)+tabs('materiality',[['matrix','Matrix'],['topics','Topics',TOPICS.length],['survey','Stakeholder survey']],tab)+body;
};

/* ---- Data quality ---- */
P.quality=()=>{
  const l=SUP.filter(s=>s.conf!=null).sort((a,b)=>a.conf-b.conf);const low=l.filter(s=>s.conf<60);
  const comp=[{l:'Verification · documents accepted',w:35,v:58},{l:'Completeness · documents and data given',w:20,v:71},{l:'Traceability · figures backed by a document',w:20,v:66},{l:'Coverage · questions answered',w:15,v:96},{l:'Timeliness · on time, in date',w:10,v:88}];
  return head('Data quality','How far the scores can be relied on')+
  `<div class="grid2"><div class="card"><h3>${low.length} suppliers have low data confidence (below 60%)</h3><p class="q">Data confidence by supplier, lowest first. Dashed lines = Medium (60) and High (80) bands.</p>${hbarSvg(l.map(s=>({l:s.name,v:s.conf,vl:s.conf+'%',c:s.conf<60?C1:GREY,tip:`${s.name}: ${s.conf}% · ${s.conf<60?'Low':s.conf<80?'Medium':'High'}`})),{max:100,refs:[{v:60,l:'Medium 60'},{v:80,l:'High 80'}]})}</div>
  <div class="card"><h3>Verification holds confidence back most</h3><p class="q">Average score of each check across suppliers · weight in brackets</p>${hbarSvg(comp.map(c=>({l:`${c.l.split(' · ')[0]} (${c.w}%)`,v:c.v,vl:c.v+'%',c:c.v<70?C1:GREY,tip:`${c.l}\nAverage ${c.v}% · weight ${c.w}%`})),{max:100,lab:170})}<p class="hint">Confidence = 35% verification + 20% completeness + 20% traceability + 15% coverage + 10% timeliness.</p><div class="cf"><span>${needs().evidence} documents waiting to be verified</span><a class="link" href="#/reviews/evidence">Verify in Reviews →</a></div></div></div>`;
};

/* ---- Reports ---- */
P.reports=()=>{
  const R=[{t:'BRSR — Principle 6 & value chain',d:'Supplier environment data for your Business Responsibility and Sustainability Report.',cov:74},{t:'EcoVadis — Sustainable procurement',d:'Supplier engagement evidence mapped to EcoVadis criteria.',cov:68},{t:'Scope 3 Category 1 — Purchased goods',d:'Supplier-specific emissions allocated by your spend (Tier 1).',cov:52},{t:'Custom export',d:'Any assessment, any columns, as Excel or CSV.',cov:null}];
  return head('Reports & exports','Framework mappings live here, not on the dashboards')+`<div class="grid2">${R.map(r=>`<div class="card"><h3>${r.t}</h3><p class="q">${r.d}</p>${r.cov!=null?`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><div class="bar" style="flex:1;height:8px"><span style="width:${r.cov}%;background:${C1}"></span></div><span style="font-size:13px;font-weight:600">${r.cov}% of fields covered</span></div>`:''}<div style="display:flex;gap:8px"><button class="btn sm pri" data-act="toastMsg" data-arg="${r.t}: export started">Export</button>${r.cov!=null?`<button class="btn sm" data-act="toastMsg" data-arg="Field mapping opens here">View field mapping</button>`:''}</div></div>`).join('')}</div>`;
};

/* ---- Questionnaires ---- */
P.questionnaires=(tab)=>{
  tab=tab||'templates';let body='';
  if(tab==='templates'){const T=[['Onboarding','Tier 1',10,'Company, permits and policies. Compulsory.'],['Onboarding','Tier 2',5,'Short basic checks. Compulsory.'],['Annual ESG','Tier 1',50,'Carbon, Scope 3, water, waste, sourcing, labour, ethics.'],['Annual ESG','Tier 2',25,'Lighter yearly review across the same areas.'],['Materiality','Stakeholders',12,'Topic ratings for impact and financial importance.'],['Follow-up review','Any',8,'Targeted re-check after a red flag or action.'],['Custom','Any',0,'Build your own from the question bank.']];
    body=`<div class="grid3">${T.map(t=>`<div class="card"><div style="display:flex;gap:8px;align-items:center"><h3>${t[0]}</h3><span class="pill p-grey">${t[1]}</span></div><p class="q">${t[3]}</p><div style="display:flex;gap:8px;align-items:center"><span style="font-size:13px;color:var(--ink2)">${t[2]?t[2]+' questions':'Empty'}</span><span style="flex:1"></span><button class="btn sm" data-act="toastMsg" data-arg="Template editor opens here">Edit</button><button class="btn sm pri" data-act="newAssess" data-arg="${t[0]}">Use</button></div></div>`).join('')}</div>`;}
  else if(tab==='bank') body=`<div class="filters"><input class="inp" style="width:280px" placeholder="Search questions"><select class="inp"><option>All sections</option><option>General</option><option>Environment</option><option>Social</option><option>Governance</option></select><button class="btn sm pri" style="margin-left:auto" data-act="toastMsg" data-arg="New question form opens here">+ Add question</button></div>
   <table class="tbl"><thead><tr><th>Question</th><th>Scoring area</th><th>Answer type</th><th>Evidence</th><th>Red flag</th><th>Tiers</th><th></th></tr></thead><tbody>${QBANK.map(q=>`<tr><td><b style="font-weight:500">${esc(q.t)}</b><small>${code(q.code)} · ${q.tpl}</small></td><td>${q.area!=null?AREAS[q.area]:'<span style="color:var(--muted)">Not scored</span>'}</td><td>${q.type}</td><td>${q.ev?'Required':'—'}</td><td>${q.rf?'<span class="risk High"><i></i>Yes</span>':'—'}</td><td>${q.tiers.map(t=>`Tier ${t}`).join(', ')}</td><td><button class="btn sm ghost" data-act="toastMsg" data-arg="Question editor opens here">Edit</button></td></tr>`).join('')}</tbody></table>`;
  else body=`<div class="grid2"><div class="card"><h3>Maturity levels</h3><p class="q">Mapped from the performance score</p><table class="tbl"><thead><tr><th>Level</th><th>Score</th><th>Meaning</th></tr></thead><tbody>${MAT.map((m,i)=>`<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${m.c};margin-right:8px"></span><b>${m.name}</b></td><td>${m.min}–${i<4?MAT[i+1].min-1:100}</td><td>${m.def}</td></tr>`).join('')}</tbody></table></div>
   <div class="card"><h3>How scores are built</h3><p class="q">Three results per supplier, plus data confidence</p><dl class="kv"><dt>Area score</dt><dd style="font-weight:400">Points ÷ maximum for the area's questions × 100</dd><dt>Performance</dt><dd style="font-weight:400">Average of the area scores; material topics weigh ×1.5</dd><dt>Basic compliance</dt><dd style="font-weight:400">Checks passed ÷ applicable checks</dd><dt>Year on year</dt><dd style="font-weight:400">Change vs the same type and tier last period (±5 = improved / declined)</dd><dt>Risk: High</dt><dd style="font-weight:400">Any red flag, or performance below 40</dd><dt>Risk: Medium</dt><dd style="font-weight:400">Compliance below 100%, or performance 40–59</dd><dt>Risk: Low</dt><dd style="font-weight:400">Full compliance and performance 60+</dd></dl></div></div>`;
  return head('Questionnaires','Templates, the question bank and scoring rules')+tabs('questionnaires',[['templates','Templates'],['bank','Question bank',QBANK.length],['scoring','Scoring rules']],tab)+body;
};
