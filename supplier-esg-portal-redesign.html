  else if(tab==='reminders') body=`<div class="grid2"><div class="card"><h3>Due dates and reminders</h3><p class="q">Defaults for new assessments and new suppliers</p><div class="fld"><label class="f">Default onboarding due date (days after invite)</label><input class="inp" type="number" value="${SETTINGS.onbDays}" data-input="onbDays"></div><div class="fld"><label class="f">Reminders before the due date (days)</label><input class="inp" value="${SETTINGS.remind.join(', ')}"></div><div class="fld"><label class="f">Escalate to admins after (days overdue)</label><input class="inp" type="number" value="${SETTINGS.escalate}"></div><button class="btn pri sm" data-act="toastMsg" data-arg="Reminder rules saved">Save</button></div>
   <div class="card"><h3>Automation</h3><p class="q">What happens without anyone clicking</p>${[['Raise an improvement action for every red flag',true],['Remind suppliers about actions due in 7, 3 and 1 days',true],['Email admins a daily digest when something needs attention',true],['Also remind team users the supplier admin assigned',false]].map(([t,c])=>`<label class="chk"><input type="checkbox" ${c?'checked':''}><span><b>${t}</b></span></label>`).join('')}</div></div>`;
  else body=`<div class="card"><h3>Email templates</h3><p class="q">What suppliers receive</p>${['Invitation to an assessment','Reminder before due date','Overdue reminder','Question from the client','Response sent back for changes'].map(t=>`<div class="chk"><span><b>${t}</b><small>Last edited by Bharat Carbon</small></span><button class="btn sm" style="margin-left:auto" data-act="toastMsg" data-arg="Template editor opens here">Edit</button></div>`).join('')}</div>`;
  return head('Settings','')+tabs('settings',[['org','Organisation & facilities'],['tiers','Tiers & spend rules'],['users','Users & roles'],['reminders','Reminders & automation'],['emails','Email templates']],tab)+body;
};

/* ============ DRAWERS ============ */
let W={};
function openDrawer(html){$('#drawer').innerHTML=html;$('#drawer').classList.add('open');$('#scrim').classList.add('open')}
function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.remove('open')}
function stepsHtml(names,cur){return `<div class="steps">${names.map((n,i)=>`<div class="${i===cur?'on':i<cur?'done':''}">${i+1}. ${n}</div>`).join('')}</div>`}

/* Add supplier: 4 steps */
function addSupplierDrawer(){
  const s=W.sup, st=W.step, names=['Basics','Classify','Assign','Send'];
  const suggested=s.spend>=SETTINGS.tier1Spend||/chem|cast|polymer|pcb|batter/i.test(s.cat)?1:2;
  let b='';
  if(st===0) b=`<div class="fld"><label class="f">Company name *</label><input class="inp" data-w="name" value="${esc(s.name)}" placeholder="e.g. Nirmal Packaging"></div>
    <div class="row2"><div class="fld"><label class="f">Contact person *</label><input class="inp" data-w="contact" value="${esc(s.contact)}"></div><div class="fld"><label class="f">Mobile</label><input class="inp" data-w="mobile" value="${esc(s.mobile)}" placeholder="+91"></div></div>
    <div class="fld"><label class="f">Contact email *</label><input class="inp" data-w="email" value="${esc(s.email)}" placeholder="name@company.com"><div class="hint">The invitation goes to this address. They set their own password.</div></div>`;
  else if(st===1) b=`<div class="row2"><div class="fld"><label class="f">Annual spend (₹ lakh) *</label><input class="inp" type="number" data-w="spend" value="${s.spend||''}"></div><div class="fld"><label class="f">City</label><input class="inp" data-w="city" value="${esc(s.city)}"></div></div>
    <div class="fld"><label class="f">Products or services supplied *</label><input class="inp" data-w="cat" value="${esc(s.cat)}" placeholder="e.g. Process chemicals"></div>
    <div class="fld"><label class="f">Facility it supplies</label><select class="inp" data-w="fac" style="width:100%">${FACILITIES.map(f=>`<option ${s.fac===f.n?'selected':''}>${f.n}</option>`).join('')}</select></div>
    <label class="f">Tier *</label><div class="choice">${[1,2].map(t=>`<button class="opt ${s.tier===t?'on':''}" data-act="wTier" data-arg="${t}"><b>Tier ${t}${t===suggested?' · suggested':''}</b><small>${t===1?'Critical: onboarding (10) + annual ESG (50)':'Other: onboarding (5) + annual ESG (25)'}</small></button>`).join('')}</div>
    <div class="hint">Suggested from spend ≥ ₹${SETTINGS.tier1Spend} L or a critical category. The full address is collected from the supplier during onboarding.</div>`;
  else if(st===2){const ann=ASSESS.filter(a=>a.status==='Active'&&a.type==='Annual ESG'&&a.tier===s.tier)[0];
    b=`<p style="margin-top:0;color:var(--ink2)">Choose what ${esc(s.name||'this supplier')} is asked to complete.</p>
    <label class="chk"><input type="checkbox" checked disabled><span><b>Supplier Onboarding — Tier ${s.tier}</b><small>Compulsory for every supplier · ${s.tier===1?10:5} questions</small></span></label>
    <div class="row2" style="margin:-2px 0 14px 28px"><div><label class="f">Due date</label><input class="inp" type="date" data-w="due" value="${s.due}"></div><div class="hint" style="align-self:end">Default: ${SETTINGS.onbDays} days after the invite (Settings)</div></div>
    ${ann?`<label class="chk"><input type="checkbox" data-wck="annual" ${s.annual?'checked':''}><span><b>Also add to ${esc(ann.title)} ${ann.period}</b><small>Due ${fd(ann.due)} · ${ann.q} questions · opens after onboarding is submitted</small></span></label>`:''}
    <label class="chk"><input type="checkbox" data-wck="mat" ${s.mat?'checked':''}><span><b>Invite as a stakeholder to the Materiality Assessment</b><small>12 topic ratings · due ${fd('2026-12-20')}</small></span></label>`;}
  else b=`<div class="callout" style="margin-bottom:14px"><b>${esc(s.contact||'The contact')}</b> at <b>${esc(s.name)}</b> will get an email at <b>${esc(s.email)}</b> with a link to create a login and start Supplier Onboarding — Tier ${s.tier}, due <b>${fd(s.due)}</b>.</div>
    <dl class="kv" style="margin-bottom:16px"><dt>Tier</dt><dd>Tier ${s.tier}</dd><dt>Annual spend</dt><dd>${inr(+s.spend||0)}</dd><dt>Assessments</dt><dd>Onboarding${s.annual?' + Annual ESG':''}${s.mat?' + Materiality survey':''}</dd><dt>Reminders</dt><dd>${SETTINGS.remind.join(', ')} days before the due date</dd></dl>
    <label class="f">When to send</label><div class="choice"><button class="opt ${s.when==='now'?'on':''}" data-act="wWhen" data-arg="now"><b>Invite now</b><small>Email goes out immediately</small></button><button class="opt ${s.when==='later'?'on':''}" data-act="wWhen" data-arg="later"><b>Schedule</b><small>Pick a date and time</small></button></div>
    ${s.when==='later'?`<div class="fld" style="margin-top:12px"><label class="f">Send on</label><input class="inp" type="datetime-local" value="${addDays(2)}T10:00"></div>`:''}`;
  const ok=st===0?(s.name&&s.contact&&/@/.test(s.email)):st===1?(s.spend&&s.cat&&s.tier):true;
  openDrawer(`<div class="dh"><h2>Add supplier</h2>${stepsHtml(names,st)}</div><div class="db">${b}</div><div class="df"><button class="btn" data-act="closeDrawer">Cancel</button><span class="sp"></span>${st>0?`<button class="btn" data-act="wBack">← Back</button>`:''}${st<3?`<button class="btn pri" data-act="wNext" ${ok?'':'disabled'}>Next →</button>`:`<button class="btn pri" data-act="wFinish">${s.when==='now'?'Add and send invite':'Add and schedule invite'}</button>`}</div>`);
}

/* New assessment: 4 steps */
function newAssessDrawer(){
  const a=W.asm,st=W.step,names=['Type','Questions','Suppliers & dates','Review & launch'];let b='';
  const types=[['Onboarding','Company, permits and policy checks'],['Annual ESG','Yearly review across 7 scoring areas'],['Materiality','Stakeholder ratings of ESG topics'],['Follow-up review','Targeted re-check after a red flag'],['Custom','Build from the question bank']];
  if(st===0) b=`<label class="f">Assessment type</label><div class="choice" style="margin-bottom:14px">${types.map(([t,d])=>`<button class="opt ${a.type===t?'on':''}" data-act="aType" data-arg="${t}"><b>${t}</b><small>${d}</small></button>`).join('')}</div>
    ${a.type!=='Materiality'?`<label class="f">For</label><div class="seg" style="margin-bottom:14px">${[1,2].map(t=>`<button class="${a.tier===t?'on':''}" data-act="aTier" data-arg="${t}">Tier ${t}</button>`).join('')}</div>`:''}
    <div class="row2"><div class="fld"><label class="f">Period</label><select class="inp" data-wa="period" style="width:100%">${['2026','2027','Q1 2027'].map(p=>`<option ${a.period===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="fld"><label class="f">Title</label><input class="inp" data-wa="title" value="${esc(a.title||`${a.type} Assessment — ${a.type==='Materiality'?'Stakeholders':'Tier '+a.tier}`)}"></div></div>`;
  else if(st===1){const qs=QBANK.filter(q=>(a.type==='Custom'||a.type==='Follow-up review'||q.tpl===(a.type==='Materiality'?'x':a.type))&&q.tiers.includes(a.tier));
    b=a.type==='Materiality'?`<p style="margin-top:0">Stakeholders rate each topic 1–5 for impact and for financial importance.</p>${TOPICS.map(t=>`<label class="chk"><input type="checkbox" checked><span><b>${esc(t.t)}</b><small>Linked area: ${AREAS[t.area]}</small></span></label>`).join('')}`:
    `<p style="margin-top:0;color:var(--ink2)">${a.type==='Custom'||a.type==='Follow-up review'?'Pick questions from the bank.':`Starting from the ${a.type} · Tier ${a.tier} template (sample shown).`} Red-flag and evidence questions are required by default.</p>
    <table class="tbl"><thead><tr><th style="width:30px"></th><th>Question</th><th>Required</th></tr></thead><tbody>${qs.map(q=>`<tr><td><input type="checkbox" ${a.type==='Custom'?'':'checked'}></td><td>${esc(q.t)}<small>${q.area!=null?AREAS[q.area]:'General'}${q.rf?' · red flag':''}</small></td><td><input type="checkbox" ${q.rf||q.ev?'checked':''}></td></tr>`).join('')}</tbody></table>
    <button class="btn sm ghost" style="margin-top:8px" data-act="toastMsg" data-arg="Supplier preview opens here">Preview as supplier →</button>`;}
  else if(st===2){const pool=a.type==='Materiality'?SUP:SUP.filter(s=>s.tier===a.tier);
    b=`<label class="f">Suppliers (${pool.length} in ${a.type==='Materiality'?'all tiers':'Tier '+a.tier})</label>${pool.map(s=>`<label class="chk"><input type="checkbox" data-wsel="${s.id}" ${a.sel.includes(s.id)?'checked':''}><span><b>${esc(s.name)}</b><small>${riskOf(s)||'Not assessed'} risk · ${inr(s.spend)}${ASSIGN.some(x=>x.sid===s.id&&asm(x.aid).type===a.type&&asm(x.aid).period===a.period)?' · already in a '+a.type+' for '+a.period:''}</small></span></label>`).join('')}
    <div class="row2" style="margin-top:12px"><div class="fld"><label class="f">Due date</label><input class="inp" type="date" data-wa="due" value="${a.due}"></div><div class="fld"><label class="f">Send invitations</label><select class="inp" style="width:100%"><option>Now, when launched</option><option>On a date…</option></select></div></div>
    <div class="callout">Reminders go out on ${SETTINGS.remind.map(d=>{const x=new Date(a.due+'T00:00:00');x.setDate(x.getDate()-d);return `<b>${fds(x.toISOString().slice(0,10))}</b>`}).join(', ')} to suppliers who haven't submitted. You can add more suppliers later with their own due date.</div>`;}
  else {const dup=ASSESS.find(x=>x.type===a.type&&x.tier===(a.type==='Materiality'?0:a.tier)&&x.period===a.period&&x.status!=='Closed');
    b=`${dup?`<div class="callout warn" style="margin-bottom:14px"><b>An assessment like this already exists:</b> ${esc(dup.title)} · ${dup.period} (${dup.status}). <a class="link" href="#/assessments/${dup.id}" data-act="closeDrawer">Add suppliers to it instead</a>, or launch anyway.</div>`:''}
    <dl class="kv"><dt>Title</dt><dd>${esc(a.title||a.type)}</dd><dt>Type</dt><dd>${a.type}${a.type!=='Materiality'?` · Tier ${a.tier}`:''}</dd><dt>Period</dt><dd>${a.period}</dd><dt>Suppliers</dt><dd>${a.sel.length} selected</dd><dt>Due</dt><dd>${fd(a.due)}</dd><dt>Compared with</dt><dd>${a.type} · ${a.type==='Materiality'?'stakeholders':'Tier '+a.tier} · previous period (automatic)</dd></dl>`;}
  openDrawer(`<div class="dh"><h2>New assessment</h2>${stepsHtml(names,st)}</div><div class="db">${b}</div><div class="df"><button class="btn" data-act="closeDrawer">Cancel</button><span class="sp"></span>${st>0?`<button class="btn" data-act="aBack">← Back</button>`:''}${st<3?`<button class="btn pri" data-act="aNext">Next →</button>`:`<button class="btn pri" data-act="aLaunch" ${a.sel.length?'':'disabled'}>Launch and invite ${a.sel.length}</button>`}</div>`);
}
function notifDrawer(){
  openDrawer(`<div class="dh"><h2>Notifications</h2></div><div class="db">${NOTIFS.map(n=>`<a href="${n.to}" data-act="closeDrawer" style="display:block;padding:12px 4px;border-bottom:1px solid var(--line)"><b style="font-weight:${n.unread?650:500}">${n.unread?'● ':''}${esc(n.t)}</b><div style="font-size:12.5px;color:var(--ink2)">${esc(n.s)} · ${fd(n.at)}</div></a>`).join('')}</div><div class="df"><button class="btn sm" data-act="readAll">Mark all read</button><span class="sp"></span><button class="btn sm" data-act="toastMsg" data-arg="Daily digest settings in Settings → Reminders & automation">Email me a daily digest</button></div>`);
}

/* ============ ACTIONS ============ */
const ACT={
  closeDrawer:()=>closeDrawer(),
  toastMsg:a=>toast(a),
  memenu:(a,el,e)=>{e.stopPropagation();$('#memenu').classList.toggle('open')},
  importMenu:(a,el,e)=>{e.stopPropagation();$('#importmenu').classList.toggle('open')},
  signout:()=>toast('Signed out (prototype)'),
  notif:()=>notifDrawer(),
  readAll:()=>{NOTIFS.forEach(n=>n.unread=false);notifDrawer();renderSide(cur())},
  dashTier:a=>{state.dashTier=a;render()},
  supTier:a=>{state.supFilter.tier=a;render()},
  supRisk:a=>{state.supFilter.risk=a;render()},
  sel:a=>{state.sel.has(a)?state.sel.delete(a):state.sel.add(a);render()},
  selAll:()=>{const r=supRows();if(state.sel.size===r.length)state.sel.clear();else r.forEach(s=>state.sel.add(s.id));render()},
  bulkInvite:()=>{let n=0;state.sel.forEach(id=>{ASSIGN.filter(x=>x.sid===id&&x.st==='not_invited').forEach(x=>{x.st='invited';x.due=addDays(SETTINGS.onbDays);n++})});state.sel.clear();toast(n?`${n} invitation${n>1?'s':''} sent · due ${fd(addDays(SETTINGS.onbDays))}`:'Everyone selected is already invited');render()},
  bulkAdd:a=>{const sel=a?[a]:[...state.sel];const tier=sel.length?sup(sel[0]).tier:1;W={step:0,asm:{type:'Annual ESG',tier,period:'2026',title:'',due:addDays(30),sel}};newAssessDrawer()},
  inviteNotInvited:()=>{let n=0;ASSIGN.filter(x=>x.st==='not_invited').forEach(x=>{x.st='invited';x.due=addDays(SETTINGS.onbDays);n++});toast(`${n} invitations sent · due ${fd(addDays(SETTINGS.onbDays))}`);render()},
  inviteOne:a=>{const [aid,sid]=a.split('|');const x=ASSIGN.find(y=>y.aid===aid&&y.sid===sid);x.st='invited';x.due=x.due||addDays(SETTINGS.onbDays);toast(`Invitation sent to ${sup(sid).name} · due ${fd(x.due)}`);render()},
  inviteAll:a=>{let n=0;ASSIGN.filter(x=>x.aid===a&&x.st==='not_invited').forEach(x=>{x.st='invited';x.due=addDays(SETTINGS.onbDays);n++});toast(`${n} invitation${n>1?'s':''} sent`);render()},
  raiseAction:a=>{const f=FLAGS.find(x=>x.id===a);f.status='Action raised';ACTIONS.push({id:'IA-0'+(ACTIONS.length+1),sid:f.sid,flag:f.id,title:'Resolve: '+f.text,owner:sup(f.sid).contact,due:addDays(30),st:'Open'});toast('Improvement action raised and shared with the supplier');render()},
  evid:a=>{const [id,st]=a.split('|');EVIDENCE.find(e=>e.id===id).st=st;toast(`Document ${st.toLowerCase()}`);render()},
  rv:a=>{const p=a.split('|');const k=p.slice(0,3).join('|');REVIEWSTATE[k]=REVIEWSTATE[k]===p[3]?null:p[3];render(true)},
  toggleThread:a=>{const t=$('#th-'+a);t.style.display=t.style.display==='none'?'':'none';const i=$('#in-'+a);if(i)i.focus()},
  send:a=>{const p=a.split('|');const k=p.slice(0,3).join('|');const i=$('#in-'+p[3]);if(!i.value.trim())return;(THREADS[k]=THREADS[k]||[]).push({who:'you',name:'Prajal',text:i.value.trim(),at:'2026-11-24'});toast('Question sent; the supplier is emailed and sees it on this answer');render(true)},
  markReviewed:a=>{const [aid,sid]=a.split('|');ASSIGN.find(x=>x.aid===aid&&x.sid===sid).st='reviewed';toast(`${sup(sid).name} marked reviewed`);location.hash='#/reviews/responses'},
  sendBack:a=>{const [aid,sid]=a.split('|');ASSIGN.find(x=>x.aid===aid&&x.sid===sid).st='reopened';toast(`Sent back to ${sup(sid).name} with your flags and questions`);location.hash='#/reviews/responses'},
  actMove:a=>{const [id,st]=a.split('|');ACTIONS.find(x=>x.id===id).st=st;toast(st==='Closed'?'Action approved and closed':'Sent back to supplier');render()},
  rpArea:a=>{state.rpArea=+a;render()},
  openAsk:a=>{location.hash=`#/suppliers/${a}/qa`;toast('Open a response and use “Ask supplier” on the answer you have a question about')},
  addSupplier:()=>{W={step:0,sup:{name:'',contact:'',mobile:'',email:'',spend:'',city:'',cat:'',fac:FACILITIES[0].n,tier:null,due:addDays(SETTINGS.onbDays),annual:false,mat:false,when:'now'}};addSupplierDrawer()},
  wNext:()=>{if(W.step===1&&!W.sup.tier)return;W.step++;addSupplierDrawer()},
  wBack:()=>{W.step--;addSupplierDrawer()},
  wTier:a=>{W.sup.tier=+a;addSupplierDrawer()},
  wWhen:a=>{W.sup.when=a;addSupplierDrawer()},
  wFinish:()=>{const s=W.sup;const id='SUP-0'+(16+SUP.length-12);
    SUP.push({id,name:s.name,tier:s.tier,cat:s.cat,city:s.city||'—',spend:+s.spend,contact:s.contact,email:s.email,fac:s.fac,score:null,areas:null,prev:null,conf:null,comp:null,added:'2026-11-24'});
    const onb=ASSESS.find(a=>a.type==='Onboarding'&&a.tier===s.tier&&a.status==='Active');const st=s.when==='now'?'invited':'not_invited';
    ASSIGN.push({aid:onb.id,sid:id,st:s.when==='now'?'invited':'invited',due:s.due,answered:0});
    if(s.annual){const ann=ASSESS.find(a=>a.type==='Annual ESG'&&a.tier===s.tier&&a.status==='Active');ASSIGN.push({aid:ann.id,sid:id,st:'invited',due:ann.due,answered:0})}
    closeDrawer();toast(s.when==='now'?`${s.name} added and invited · onboarding due ${fd(s.due)}`:`${s.name} added · invite scheduled`);location.hash=`#/suppliers/${id}/assessments`},
  newAssess:a=>{W={step:0,asm:{type:a||'Annual ESG',tier:1,period:'2026',title:'',due:addDays(30),sel:[]}};newAssessDrawer()},
  aType:a=>{W.asm.type=a;W.asm.title='';newAssessDrawer()},
  aTier:a=>{W.asm.tier=+a;W.asm.title='';W.asm.sel=[];newAssessDrawer()},
  aNext:()=>{W.step++;newAssessDrawer()},
  aBack:()=>{W.step--;newAssessDrawer()},
  aLaunch:()=>{const a=W.asm;const id='A'+(ASSESS.length+1);ASSESS.push({id,title:a.title||`${a.type} Assessment — Tier ${a.tier}`,type:a.type,tier:a.type==='Materiality'?0:a.tier,period:a.period,due:a.due,status:'Active',q:a.type==='Annual ESG'?(a.tier===1?50:25):12,started:'2026-11-24'});
    if(a.type!=='Materiality') a.sel.forEach(sid=>ASSIGN.push({aid:id,sid,st:'invited',due:a.due,answered:0}));closeDrawer();state.sel.clear();toast(`Launched · ${a.sel.length} invitations sent`);location.hash=a.type==='Materiality'?'#/materiality/survey':`#/assessments/${id}`},
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));return}
  if(t.tagName==='BUTTON') e.preventDefault();
  const fn=ACT[t.dataset.act];if(fn) fn(t.dataset.arg,t,e);
  if(t.dataset.act!=='memenu'&&t.dataset.act!=='importMenu') document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.w!=null){W.sup[t.dataset.w]=t.value;const btn=$('#drawer [data-act="wNext"]');if(btn){const s=W.sup;btn.disabled=!(W.step===0?(s.name&&s.contact&&/@/.test(s.email)):(s.spend&&s.cat&&s.tier))}}
  if(t.dataset.wa!=null){W.asm[t.dataset.wa]=t.value}
  if(t.dataset.input==='supq'){state.supFilter.q=t.value;const pos=t.selectionStart;render();const n=document.querySelector('[data-input="supq"]');n.focus();n.setSelectionRange(pos,pos)}
  if(t.dataset.input&&SETTINGS[t.dataset.input]!=null){SETTINGS[t.dataset.input]=+t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.wck){W.sup[t.dataset.wck]=t.checked}
  if(t.dataset.wsel){const s=W.asm.sel;t.checked?s.push(t.dataset.wsel):s.splice(s.indexOf(t.dataset.wsel),1);const b=$('#drawer [data-act="aLaunch"]');if(b){b.disabled=!s.length;b.textContent=`Launch and invite ${s.length}`}}
  if(t.dataset.w=='fac'){W.sup.fac=t.value}
});
$('#gsearch').addEventListener('keydown',e=>{if(e.key==='Enter'){state.supFilter.q=e.target.value;state.supFilter.tier='all';state.supFilter.risk='all';location.hash='#/suppliers';render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

/* Tooltip */
const tipEl=$('#tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(t){tipEl.textContent=t.getAttribute('data-tip');tipEl.style.opacity=1}else tipEl.style.opacity=0});
document.addEventListener('mousemove',e=>{if(tipEl.style.opacity==='1'){const w=tipEl.offsetWidth;tipEl.style.left=Math.min(e.clientX+14,innerWidth-w-8)+'px';tipEl.style.top=(e.clientY+14)+'px'}});

/* ============ ROUTER ============ */
function cur(){return (location.hash.slice(2)||'dashboard').split('/')[0]}
function render(keepScroll){
  const parts=(location.hash.slice(2)||'dashboard').split('/');let [p,a,b]=parts;
  const navKey=p==='response'?'reviews':p;
  renderSide(navKey);
  const fn=P[p]||P.dashboard;const y=window.scrollY;
  $('#main').innerHTML=`<div class="page">${fn(a,b)}</div>`;
  document.title=`${({dashboard:'Dashboard',suppliers:'Suppliers',assessments:'Assessments',reviews:'Reviews',response:'Review response',actions:'Improvement actions',risk:'Risk & performance',materiality:'Materiality',quality:'Data quality',reports:'Reports & exports',questionnaires:'Questionnaires',settings:'Settings'})[p]||'Dashboard'} · Supplier ESG Assessment`;
  window.scrollTo(0,keepScroll?y:0);
}
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#/'))return;render()});
render();
</script>
</body>
